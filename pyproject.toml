[project]
name = "reparo-playwright-bridge"
version = "0.1.0"
description = "Playwright connector for Reparo: run block-structured browser processes and hand failures to Reparo for recovery."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
