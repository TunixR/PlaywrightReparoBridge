# `pre-commit install` installs both hook types below. CI runs the same hooks (lint.yml).
# Every tool is a dev dependency, so uv.lock sets its version here, in CI and on the command line.
# Each one is configured in pyproject.toml, except jscpd (.jscpd.json).
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter)
        entry: uv run ruff check --force-exclude --fix
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff (formatter)
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: basedpyright
        name: basedpyright (type checking)
        entry: uv run basedpyright
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml)$'

      - id: import-linter
        name: import-linter (which module imports which)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml)$'

      - id: deptry
        name: deptry (imports match declared dependencies)
        entry: uv run deptry .
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml|^uv\.lock)$'

      - id: vulture
        name: vulture (unused code)
        entry: uv run vulture
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml)$'

      - id: complexipy
        name: complexipy (cognitive complexity)
        entry: uv run complexipy
        language: system
        pass_filenames: false
        files: '(\.py|^pyproject\.toml)$'

      - id: jscpd
        name: jscpd (duplicated code)
        entry: uv run jscpd --no-colors
        language: system
        pass_filenames: false
        files: '(\.py|^\.jscpd\.json)$'

      - id: commit-format
        name: commit message format
        # Same check as the PR title: AGENTS.md -> Commits.
        entry: python3 scripts/commit_format.py check-commit
        language: system
        stages: [commit-msg]
